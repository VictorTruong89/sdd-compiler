[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lend-ref"
version = "0.0.1"
description = "Reference implementation for the lend pilot task: proves the hidden tests are passable. Never shown to an agent."
requires-python = ">=3.11"

[project.scripts]
lend = "lend_ref.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
